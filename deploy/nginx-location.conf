location = /yuyan {
    return 308 /yuyan/$is_args$args;
}
location ^~ /yuyan/ {
    location = /yuyan/api/attachments {
        client_max_body_size 0;
        proxy_request_buffering off;
        rewrite ^/yuyan/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18084;
    }

    # iOS may fetch home-screen artwork without the browser's device cookie.
    # Only these public branding files bypass authentication; never allow all assets.
    location ~ ^/yuyan/static/(?:favicon\.svg|apple-touch-icon\.png)$ {
        auth_request off;
        limit_except GET { deny all; }
        rewrite ^/yuyan/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18084;
    }

    proxy_pass http://127.0.0.1:18084/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Attachment uploads have their own streaming location above. Other request limits remain.
    client_max_body_size 26m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_next_upstream off;
    proxy_redirect off;
    # The server's outbound bandwidth is about 0.5 MB/s, so every text response is compressed.
    # Go serves .js as text/javascript.
    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;
}
