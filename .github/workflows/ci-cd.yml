name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支顺序完成检查和发布，避免旧发布覆盖后来的提交。
concurrency:
  group: yuyan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Build, check parity and test
        run: |
          npm --prefix web run build
          npm --prefix web run parity
          git diff --exit-code -- internal/render/testdata
          make test
          for script in deploy/*.sh; do bash -n "$script"; done
          bash deploy/test-release.sh
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o bin/yuyan-linux-amd64 ./cmd/yuyan
      # Browser smoke tests on a fresh instance with synthetic data; a failure stops the deployment.
      - name: End-to-end tests
        run: |
          go build -trimpath -o bin/yuyan ./cmd/yuyan
          cd web
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Keep end-to-end traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-traces
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Save deployable binary
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yuyan-linux
          path: bin/yuyan-linux-amd64
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: yuyan-linux
          path: artifact
      - name: Deploy through restricted SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" != "$DEPLOY_COMMIT" ]]; then
            echo 'A newer main commit exists; skip this stale deployment.'
            exit 0
          fi
          credentials=$(mktemp -d "$RUNNER_TEMP/yuyan-ssh.XXXXXX")
          trap 'rm -f "$credentials/key" "$credentials/known_hosts"; rmdir "$credentials"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$credentials/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$credentials/known_hosts"
          chmod 600 "$credentials/key" "$credentials/known_hosts"
          digest=$(sha256sum artifact/yuyan-linux-amd64 | cut -d ' ' -f 1)
          # deploy-release.sh reads a gzip stream and checks the SHA-256 of the uncompressed program.
          gzip -9 -c artifact/yuyan-linux-amd64 | ssh -T -i "$credentials/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$credentials/known_hosts" \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$SSH_USER@$SSH_HOST" "deploy $DEPLOY_COMMIT $digest"
          curl --fail --silent --show-error --max-time 15 "http://$SSH_HOST/yuyan/healthz"
