<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="yuyan-base" content="{{.Base}}">
<title>{{.Title}}</title>
<link rel="icon" href="{{static "favicon.svg"}}" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="{{static "apple-touch-icon.png"}}?v=bird">
<script>try{var d=document.documentElement,t=localStorage.getItem('yuyan:theme');if(t==='light'||t==='dark')d.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="{{static "chroma.css"}}">
{{range .Assets.CSS}}<link rel="stylesheet" href="{{static .}}">
{{end}}<script type="module" src="{{static .Assets.JS}}"></script>
{{range .Assets.Preload}}<link rel="modulepreload" href="{{static .}}">
{{end}}{{range .Assets.ViewPreload}}<link rel="modulepreload" fetchpriority="low" href="{{static .}}">
{{end}}{{range .Assets.ViewCSS}}<link rel="preload" as="style" crossorigin fetchpriority="low" href="{{static .}}">
{{end}}
</head>
<body>
<div id="app"></div>
<script id="yy-initial" type="application/json">{{.Initial}}</script>
</body>
</html>
