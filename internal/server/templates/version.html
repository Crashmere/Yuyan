{{define "title"}}版本预览：{{.Data.Version.Title}} - 语燕{{end}}
{{define "main"}}
{{$v := .Data.Version}}{{$d := .Data.Doc}}
<main class="yy-main yy-narrow">
  <div class="yy-doc-head">
    <a class="yy-crumb" href="{{link "docs/" $d.ID "/history"}}">← 历史版本</a>
    <div class="yy-actions">
      {{if ne $v.Revision $d.Revision}}<button class="primary" data-action="restore-version" data-version="{{$v.ID}}" data-doc="{{$d.ID}}" data-revision="{{$d.Revision}}">恢复此版本</button>{{end}}
    </div>
  </div>
  <p class="yy-banner">这是 {{when $v.CreatedAt}} 的版本（{{reason $v.Reason}}）。</p>
  <article class="yy-article">
    <h1 class="yy-title">{{$v.Title}}</h1>
    <div class="yy-content">{{html .Data.HTML}}</div>
  </article>
</main>
{{end}}
